<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<!--
			The phone's status and navigation bars are painted from these two values,
			never from the app's brand green. An installed Android app only reads
			them from the web app manifest, and one manifest cannot hold a light and
			a dark colour, so there are two manifests and the link is pointed at the
			matching one before first paint and on every theme change.
		-->
		<meta name="theme-color" content="#f8fafc" />
		<script>
			// Runs before first paint so a chosen dark theme never flashes white, and so the
			// system bars are drawn in the right colour from the first frame.
			try {
				var pref = localStorage.getItem('vault.theme') || 'light';
				var dark =
					pref === 'dark' ||
					(pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
				var root = document.documentElement;
				root.dataset.theme = dark ? 'dark' : 'light';
				root.style.colorScheme = dark ? 'dark' : 'light';
				var chrome = document.querySelector('meta[name="theme-color"]');
				if (chrome) chrome.setAttribute('content', dark ? '#0b1220' : '#f8fafc');
				var manifest = document.querySelector('link[rel="manifest"]');
				if (manifest) manifest.setAttribute('href', dark ? '/manifest.dark.webmanifest' : '/manifest.webmanifest');
			} catch (error) {
				/* a browser without storage just gets the light default */
			}
		</script>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/tandem-192.png" type="image/png" />
		<link rel="apple-touch-icon" href="/icons/tandem-192.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
