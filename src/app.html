<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<!--
			Deliberately no theme-color and no manifest theme colour: any colour we
			declare is used to tint the phone's status bar and navigation bar, and
			it never matches both themes at once. With nothing declared the bars
			stay the system's own, which is what every other app on the phone does.
		-->
		<script>
			// Runs before first paint so a dark phone never flashes white.
			try {
				var pref = localStorage.getItem('vault.theme') || 'auto';
				var dark =
					pref === 'dark' ||
					(pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
				var root = document.documentElement;
				root.dataset.theme = dark ? 'dark' : 'light';
				root.style.colorScheme = dark ? 'dark' : 'light';
			} catch (error) {
				/* a browser without storage just gets the light default */
			}
		</script>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/vault-192.png" type="image/png" />
		<link rel="apple-touch-icon" href="/icons/vault-192.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
